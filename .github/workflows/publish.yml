name: Publish Docker Containers to GHCR

on:
  workflow_dispatch: # Allows manual trigger of this workflow

env:
  REGISTRY: ghcr.io
  # We use repository owner in lowercase to construct image names cleanly
  BACKEND_IMAGE_NAME: ${{ github.repository_owner }}/boat-backend
  FRONTEND_IMAGE_NAME: ${{ github.repository_owner }}/boat-frontend

jobs:
  build-and-push:
    name: Build & Publish Containers
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in to GitHub Container Registry (GHCR)
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- BACKEND CONTAINER METADATA ---
      - name: Extract Backend Metadata
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=ref,event=tag

      # --- BUILD & PUSH BACKEND ---
      - name: Build and Push Backend Container
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Containerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- FRONTEND CONTAINER METADATA ---
      - name: Extract Frontend Metadata
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=ref,event=tag

      # --- BUILD & PUSH FRONTEND ---
      - name: Build and Push Frontend Container
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Containerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- CLEANUP OLD PACKAGE VERSIONS (KEEP MAX 3) ---
      - name: Prune Old Backend Container Versions
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          owner: ${{ github.repository_owner }}
          package-name: 'boat-backend'
          package-type: 'container'
          min-versions-to-keep: 3
          delete-only-untagged-versions: 'false'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prune Old Frontend Container Versions
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          owner: ${{ github.repository_owner }}
          package-name: 'boat-frontend'
          package-type: 'container'
          min-versions-to-keep: 3
          delete-only-untagged-versions: 'false'
          token: ${{ secrets.GITHUB_TOKEN }}
